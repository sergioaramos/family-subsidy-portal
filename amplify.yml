# Build de Amplify Hosting (ADR-12). Cada rama (dev, main) despliega su propio backend.
# Las pruebas de unidad y contrato bloquean el despliegue si fallan.
# Las de integración (DynamoDB Local en Docker) corren en GitHub Actions: .github/workflows/pruebas.yml
version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
        - npm test
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
